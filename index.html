<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Train Eye — 2D anime compositing in WebGL</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0505;color:#f3dcd6;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;box-sizing:border-box;height:100%}
  #stage{aspect-ratio:9/16;height:calc(100vh - 130px);max-width:100%;width:auto;background:#000;border-radius:8px;box-shadow:0 0 40px #5a0a0a}
  .ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  button,#dl{background:#b3121b;color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none}
  button:disabled{opacity:.45;cursor:default}
  #dl{display:none;background:#2a7d3c}
  .prog{width:min(560px,92vw);height:6px;background:#2a1212;border-radius:3px;overflow:hidden}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#ff5a2a,#ffd27a)}
  #status{opacity:.85;text-align:center}
  small{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <div class="prog"><div id="bar"></div></div>
  <div class="ui">
    <button id="start" disabled>▶ Start Animation</button>
    <button id="render" disabled>⬇ Render &amp; Download</button>
    <a id="dl" href="#">Download</a>
  </div>
  <div id="status">Loading layers…</div>
  <small>Runs on your GPU (WebGL2). Render uses WebCodecs (H.264 → MP4, VP9 → WebM fallback). Sound: Mixkit / VideoEditingSFX library effects — see README.</small>
</div>
<script src="vendor/mp4-muxer.js"></script>
<script src="vendor/webm-muxer.js"></script>
<script src="app.js"></script>
</body>
</html>
